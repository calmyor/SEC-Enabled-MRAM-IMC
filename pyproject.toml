[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sec-mram-imc-measurements"
version = "0.1.0"
description = "Public-safe reference methods for SEC-enabled MRAM IMC measurement analysis"
readme = "measurements/README.md"
requires-python = ">=3.10"
authors = [
  { name = "SEC-enabled MRAM IMC authors" },
]
dependencies = []

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

